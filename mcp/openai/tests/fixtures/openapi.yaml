openapi: 3.0.0
info:
  title: Fixture OpenAI API
  version: 0.0.1
paths:
  /models:
    get:
      operationId: listModels
      summary: Lists the currently available models.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
  /files:
    post:
      operationId: createFile
      tags: [Files]
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateFileRequest"
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
  /files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      summary: Returns information about a specific file.
      responses:
        "200":
          description: OK
    delete:
      summary: Delete a file.
      responses:
        "200":
          description: OK
components:
  parameters:
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ModelList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    Model:
      type: object
      properties:
        id:
          type: string
        parent:
          $ref: "#/components/schemas/Model"
    CreateFileRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        purpose:
          type: string
