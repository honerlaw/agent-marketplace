# Context-usage benchmark for a full minerva:propose-ship-auto run.
#
# This is NOT a per-PR gate — it spends real money, is non-deterministic, and a
# real auto run has side effects (worktrees, commits, and a ship-phase PR). It
# runs only on a schedule and on explicit manual dispatch, and it must target a
# THROWAWAY scratch repo whose ship phase cannot push to this repo. It appends a
# record to benchmarks/baseline.jsonl (committed, append-only) so runs are
# comparable across commits.
#
# Requires the `ANTHROPIC_API_KEY` repo secret. See
# .minerva/work/037-run-context-footprint-estimator/proposal.md.
name: benchmark

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      max_turns:
        description: "Hard turn cap for the benchmarked run"
        required: false
        default: "200"

permissions:
  contents: write # to commit the appended baseline record

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard — require the API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set — the benchmark cannot run."
            exit 1
          fi

      - name: Install the Claude Code CLI + minerva plugin
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin install minerva@agent-marketplace || true

      - name: Run the benchmark against an isolated scratch repo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_TURNS: ${{ github.event.inputs.max_turns || '200' }}
        run: |
          # Isolated repo with NO remote, so the ship phase cannot push a PR
          # anywhere real. minerva is installed user-globally above.
          scratch="$(mktemp -d)"
          git -C "$scratch" init -q
          git -C "$scratch" config user.email bench@example.com
          git -C "$scratch" config user.name bench
          printf '# scratch\n' > "$scratch/README.md"
          printf 'def main():\n    return 0\n' > "$scratch/app.py"
          git -C "$scratch" add -A && git -C "$scratch" commit -qm init
          python scripts/run_benchmark.py run --cwd "$scratch" --max-turns "$MAX_TURNS"

      - name: Show the delta vs the previous run
        run: python scripts/run_benchmark.py diff || true

      - name: Commit the appended baseline record
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add benchmarks/baseline.jsonl
          git commit -m "bench: record propose-ship-auto run [skip ci]" || echo "no change"
          git push || echo "push skipped"
