name: evals

# Deterministic skill-eval gate — runs on every PR and push to main.
# Covers the structural contract floor, the behavioral runner's stubbed unit
# tests, and a no-API --dry-run of the behavioral runner. No secrets, no API.
#
# The whole suite runs, deliberately: `pytest tests/` rather than an enumerated
# module list. The list existed only because a bare `pytest` aborted during
# collection on tests for the `financials` plugin, deleted in 20d32e0 — those
# tests are now gone too. An enumerated list makes a new test module invisible to
# CI until someone remembers to append it, and the failure is silent: the module
# simply never runs and nothing goes red. That cost us once already (the snippet
# tests shipped dark). Collection is now the enumeration.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Structural contract floor + runner unit tests (deterministic, no API)
        run: python -m pytest tests/ -q

      - name: Behavioral runner --dry-run (parse + plan, zero API)
        run: python scripts/run_skill_evals.py --dry-run

      - name: Knowledge-wiki drift gate (deterministic, read-only)
        run: python scripts/knowledge_lint.py .minerva/knowledge
